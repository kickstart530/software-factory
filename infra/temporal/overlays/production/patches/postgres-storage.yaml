apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: software-factory
spec:
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 8Gi
