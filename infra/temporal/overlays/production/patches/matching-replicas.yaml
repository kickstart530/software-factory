apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-matching
  namespace: software-factory
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: temporal-matching
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
