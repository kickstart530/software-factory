apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-history
  namespace: software-factory
spec:
  replicas: 5
  template:
    spec:
      containers:
        - name: temporal-history
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 4Gi
