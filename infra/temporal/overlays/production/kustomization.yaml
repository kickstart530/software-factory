apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: software-factory

resources:
  - ../../base

patches:
  - path: patches/postgres-storage.yaml
    target:
      kind: StatefulSet
      name: postgres
  - path: patches/frontend-replicas.yaml
    target:
      kind: Deployment
      name: temporal-frontend
  - path: patches/history-replicas.yaml
    target:
      kind: Deployment
      name: temporal-history
  - path: patches/matching-replicas.yaml
    target:
      kind: Deployment
      name: temporal-matching

commonLabels:
  environment: production
