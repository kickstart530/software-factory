---
apiVersion: v1
kind: Pod
metadata:
  name: temporal-admin-tools
  namespace: software-factory
  labels:
    app: temporal
    component: admin-tools
spec:
  containers:
    - name: admin-tools
      image: temporalio/admin-tools:1.22.4
      command:
        - /bin/sh
        - -c
        - |
          echo "Temporal admin tools ready. Use 'kubectl exec' to run tctl commands."
          echo "Example: kubectl exec -it temporal-admin-tools -n software-factory -- tctl namespace list"
          tail -f /dev/null
      env:
        - name: TEMPORAL_CLI_ADDRESS
          value: "temporal-frontend.software-factory.svc.cluster.local:7233"
        - name: TEMPORAL_ADDRESS
          value: "temporal-frontend.software-factory.svc.cluster.local:7233"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  restartPolicy: Always
