---
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: software-factory
  labels:
    app: temporal
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 7233
      targetPort: 7233
      protocol: TCP
      name: grpc
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app: temporal
    component: frontend

