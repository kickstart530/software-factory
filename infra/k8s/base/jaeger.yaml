---
# Jaeger all-in-one for local development
# Production: use Jaeger Operator or a managed service (Grafana Tempo, etc.)
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: factory-system
  labels:
    app: jaeger
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: query-http
      port: 16686
      targetPort: 16686
      protocol: TCP
  selector:
    app: jaeger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: factory-system
  labels:
    app: jaeger
spec:
  type: NodePort
  ports:
    - name: query-http
      port: 16686
      targetPort: 16686
      nodePort: 16686
      protocol: TCP
  selector:
    app: jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: factory-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.51
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 16686
              name: query-http
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
