---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-worker
  namespace: software-factory
  labels:
    app: factory-worker

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-worker
  namespace: software-factory
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-worker
  namespace: software-factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: factory-worker
subjects:
  - kind: ServiceAccount
    name: factory-worker
    namespace: software-factory
