apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: software-factory

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: factory-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: debug

commonLabels:
  environment: development
