name: Validate Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/validate-infra.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'

jobs:
  validate-kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Set up kubeconform
        run: |
          curl -LO https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Temporal base manifests
        run: |
          echo "Building Temporal base manifests..."
          kustomize build infra/temporal/base | kubeconform -strict -summary

      - name: Validate Temporal production manifests
        run: |
          echo "Building Temporal production manifests..."
          kustomize build infra/temporal/overlays/production | kubeconform -strict -summary

      - name: Validate Worker base manifests
        run: |
          echo "Building Worker base manifests..."
          kustomize build infra/workers/base | kubeconform -strict -summary

      - name: Validate Worker production manifests
        run: |
          echo "Building Worker production manifests..."
          kustomize build infra/workers/overlays/production | kubeconform -strict -summary

      - name: Validate Worker development manifests
        run: |
          echo "Building Worker development manifests..."
          kustomize build infra/workers/overlays/development | kubeconform -strict -summary

      - name: Check for secrets in manifests
        run: |
          echo "Checking for hardcoded secrets..."
          ! grep -r "password:" infra/ \
            --exclude="*.md" \
            | grep -v "REPLACE_WITH_ACTUAL_PASSWORD" \
            | grep -v "valueFrom" \
            | grep -v "secretKeyRef" \
            | grep -v "{{ .Env." \
            | grep -v "# " \
            || exit 1
          echo "No hardcoded secrets found."

  validate-docker:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker Dockerfile (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file infra/workers/Dockerfile \
            --tag factory-worker:ci-test \
            .

  markdown-lint:
    name: Lint Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Markdown Lint
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: |
            infra/*.md
            infra/temporal/*.md
            infra/workers/*.md
            docs/ops/*.md
          config_file: .markdownlint.json
          ignore_files: ''
        continue-on-error: true

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [validate-kubernetes, validate-docker]
    steps:
      - name: Success
        run: |
          echo "✅ All infrastructure validation checks passed!"
          echo ""
          echo "Validated:"
          echo "  - Temporal cluster manifests (base + production)"
          echo "  - Worker manifests (base + production + development)"
          echo "  - Dockerfile builds"
          echo "  - No hardcoded secrets"
