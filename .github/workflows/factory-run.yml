name: factory-run

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: "Path to Task JSON file in the repo (e.g. tasks/example.json)"
        required: true
        type: string
      workspace_path:
        description: "Path to workspace directory"
        required: false
        type: string
        default: "."
      risk_tier:
        description: "Risk tier (low, medium, high)"
        required: false
        type: choice
        options:
          - low
          - medium
          - high
        default: low

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The agent runs shell commands in this checkout; don't leave the
          # GITHUB_TOKEN in .git/config where `git config` would print it.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,otel]"

      - name: Run task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Inputs go through the environment, never into the script text, so a
          # crafted value can't inject shell commands.
          TASK_FILE: ${{ inputs.task_file }}
          WORKSPACE_PATH: ${{ inputs.workspace_path }}
          RISK_TIER: ${{ inputs.risk_tier }}
        run: |
          mkdir -p .factory-runs
          factory run \
            --task "$TASK_FILE" \
            --workspace "$WORKSPACE_PATH" \
            --state-dir .factory-runs \
            --risk-tier "$RISK_TIER"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run-${{ github.run_id }}
          path: |
            .factory-runs/traces/
            .factory-runs/checkpoints/
            .factory-runs/artifacts/
          retention-days: 7
