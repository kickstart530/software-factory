name: factory-run

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: "Path to Task JSON file in the repo (e.g. tasks/example.json)"
        required: true
        type: string
      workspace_path:
        description: "Path to workspace directory"
        required: false
        type: string
        default: "."
      risk_tier:
        description: "Risk tier (low, medium, high)"
        required: false
        type: choice
        options:
          - low
          - medium
          - high
        default: low

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,otel]"

      - name: Run task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p .factory-runs
          factory run \
            --task "${{ inputs.task_file }}" \
            --workspace "${{ inputs.workspace_path }}" \
            --state-dir .factory-runs \
            --risk-tier "${{ inputs.risk_tier }}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run-${{ github.run_id }}
          path: |
            .factory-runs/traces/
            .factory-runs/checkpoints/
            .factory-runs/artifacts/
          retention-days: 7
