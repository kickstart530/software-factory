name: factory-run

# Run one factory task on demand: `factory run` against this repository's checkout.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Path to a Task JSON file in this repository"
        required: true
      risk_tier:
        description: "Work Order risk tier"
        type: choice
        options: [low, medium, high]
        default: low

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run task
        env:
          # Read by the harness's model client only; agent shell commands and
          # gates run with a minimal environment that excludes it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK: ${{ inputs.task }}
          RISK_TIER: ${{ inputs.risk_tier }}
        run: |
          factory run --task "$TASK" --workspace . --risk-tier "$RISK_TIER" \
            --state-dir "$RUNNER_TEMP/factory-runs" | tee "$RUNNER_TEMP/result.json"
      - name: Upload traces and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/factory-runs
            ${{ runner.temp }}/result.json
          if-no-files-found: ignore
