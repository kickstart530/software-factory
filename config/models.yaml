# Model Gateway routing (AD-5). This file is the only place model IDs live.
#
# Every tier starts on the same model and differs by effort: measure the most
# capable model at lower effort before introducing a multi-model cascade, which
# also forfeits prompt-cache reuse across models. Repoint a tier only after the
# eval suite shows it holds quality.
tiers:
  frontier:
    model: claude-opus-5-5
    effort: high
  mid:
    model: claude-opus-5-5
    effort: medium
  small:
    model: claude-opus-5-5
    effort: low

# USD per million tokens, used by the Budget Ledger to price each call.
pricing:
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
