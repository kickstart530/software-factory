[project]
name = "software-factory"
version = "0.1.0"
description = "Cloud-hosted software factory of AI agents built on a shared agent harness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13",
    "kubernetes>=31.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "temporalio>=1.7",
    "flask>=3.0",
    "pyjwt[crypto]>=2.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require real cluster)",
]
addopts = "-m 'not integration'"
